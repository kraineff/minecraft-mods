name: ci

# Проверки, сборка и публикация — одним прогоном по тому, что изменил пуш или PR (скиллы checks
# и release). План — `scripts/ci.mjs plan` той же логикой, что `verify-changed` локально:
# правка мода — сборка этого мода по всем его целям, правка общей сборки (build-logic/, gradle/,
# config/) — всех модов, документация — только проверки. Ручной запуск и правка самого
# конвейера — все моды по всем целям.
# Публикуются моды с `modrinth_id`, у которых за пуш в main выросла `mod_version`, — и только
# после зелёных проверок и сборок того же прогона: JAR под каждую цель на Modrinth, затем ссылки,
# описание и галерея проекта, тег `<мод>/<версия>` и GitHub Release с JAR и changelog.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Мод, чью версию из репозитория выложить на Modrinth (повтор безопасен); пусто — только полный прогон
        required: false
        type: string

# PR: новый пуш отменяет прежний прогон. main — никогда: отменилась бы его публикация
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # база пуша или PR нужна для диффа и сравнения версий, теги — для галереи
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Статические проверки
        run: npm run checks

      - name: Тесты скриптов
        run: npm run test:scripts

      - name: План
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PUBLISH: ${{ inputs.publish }}
        run: node scripts/ci.mjs plan >> "$GITHUB_OUTPUT"

  build:
    needs: checks
    if: needs.checks.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.checks.outputs.build) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Компиляция всех наборов исходников (с gametests) и Checkstyle
      - name: Сборка
        run: ./gradlew -p "mods/${{ matrix.mod }}" build -PtargetMc="${{ matrix.target }}" --continue

  publish:
    needs: [checks, build]
    # build пропущен, когда собирать нечего, — это не провал
    if: >-
      !cancelled() && needs.checks.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.checks.outputs.publish != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.checks.outputs.publish) }}
    env:
      MOD: ${{ matrix.mod }}
      VERSION: ${{ matrix.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: gradle/actions/setup-gradle@v6

      # Повтор прогона не плодит версии: уже выложенная цель пропускается
      - name: Уже на Modrinth?
        id: check
        run: node scripts/modrinth.mjs published "$MOD" "$VERSION+$TARGET" >> "$GITHUB_OUTPUT"

      - name: Публикация на Modrinth
        if: steps.check.outputs.published != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          changelog="$(node scripts/ci.mjs changelog "$MOD" "$VERSION")"
          ./gradlew -p "mods/$MOD" modrinth -PtargetMc="$TARGET" -Pchangelog="$changelog"

      - name: JAR для GitHub Release
        run: ./gradlew -p "mods/$MOD" jar -PtargetMc="$TARGET"

      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.mod }}-${{ matrix.target }}
          path: mods/${{ matrix.mod }}/build/libs/${{ matrix.mod }}-${{ matrix.version }}+${{ matrix.target }}.jar
          if-no-files-found: error

  release:
    needs: [checks, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success'
      && needs.checks.outputs.release != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.checks.outputs.release) }}
    env:
      MOD: ${{ matrix.mod }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # теги прошлых релизов — по ним галерея понимает, менялись ли скриншоты
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ссылки, описание и галерея проекта Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: node scripts/modrinth.mjs sync "$MOD"

      - uses: actions/download-artifact@v8
        with:
          pattern: jar-${{ matrix.mod }}-*
          path: jars
          merge-multiple: true

      - name: Тег и GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$MOD/$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Релиз $tag уже есть"
            exit 0
          fi
          node scripts/ci.mjs changelog "$MOD" "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" jars/*.jar --target "$GITHUB_SHA" --title "$MOD $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Релиз — https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
