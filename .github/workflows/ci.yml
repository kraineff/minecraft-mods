name: ci

# Проверки, сборка и публикация — одним прогоном по тому, что изменил пуш или PR (скиллы checks
# и release). План — `scripts/ci.mjs plan` той же логикой, что `verify-changed` локально:
# правка мода — сборка этого мода по всем его целям, правка общей сборки (build-logic/, gradle/,
# config/) — всех модов, документация — только проверки. Ручной запуск и правка самого
# конвейера — все моды по всем целям.
# Публикуются моды с `modrinth_id`, у которых за пуш в main выросла `mod_version`, — и только
# после зелёных проверок и сборок того же прогона: на Modrinth уходят те самые JAR, что собрал и
# проверил job build, затем ссылки, описание и галерея проекта, тег `<мод>/<версия>` и GitHub
# Release с JAR и changelog. Ручной запуск с полем publish — порт: текущая версия мода уходит на
# цели, где её ещё нет (новая версия игры или снапшот); выложенное пропускается.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Мод, чью текущую версию выложить на цели, где её ещё нет (порт на новую версию игры); пусто — только полный прогон
        required: false
        type: string

# PR: новый пуш отменяет прежний прогон. main — никогда: отменилась бы его публикация
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # база пуша или PR нужна для диффа и сравнения версий, теги — для галереи
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Статические проверки
        run: npm run checks

      - name: Тесты скриптов
        run: npm run test:scripts

      - name: План
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PUBLISH: ${{ inputs.publish }}
        run: node scripts/ci.mjs plan >> "$GITHUB_OUTPUT"

  build:
    needs: checks
    if: needs.checks.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.checks.outputs.build) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Компиляция всех наборов исходников (с gametests) и Checkstyle
      - name: Сборка
        run: ./gradlew -p "mods/${{ matrix.mod }}" build -PtargetMc="${{ matrix.target }}" --continue

      # JAR публикуемого мода: publish и GitHub Release выкладывают ровно его, без второй сборки
      - name: JAR для публикации
        if: matrix.publish
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.mod }}-${{ matrix.target }}
          path: mods/${{ matrix.mod }}/build/libs/${{ matrix.mod }}-${{ matrix.version }}+${{ matrix.target }}.jar
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [checks, build]
    # публикуемый мод всегда в build: его JAR берутся оттуда
    if: >-
      !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success'
      && needs.checks.outputs.publish != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.checks.outputs.publish) }}
    env:
      MOD: ${{ matrix.mod }}
      VERSION: ${{ matrix.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: jar-${{ matrix.mod }}-${{ matrix.target }}
          path: jars

      # Уже выложенная под эту цель версия пропускается — повтор прогона и порт безопасны
      - name: Публикация на Modrinth
        id: upload
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: node scripts/modrinth.mjs upload "$MOD" "$TARGET" "jars/$MOD-$VERSION+$TARGET.jar"

      # В GitHub Release идёт только то, что выложено этим прогоном
      - name: JAR для GitHub Release
        if: steps.upload.outputs.uploaded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.mod }}-${{ matrix.target }}
          path: jars/${{ matrix.mod }}-${{ matrix.version }}+${{ matrix.target }}.jar
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [checks, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success'
      && needs.checks.outputs.release != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.checks.outputs.release) }}
    env:
      MOD: ${{ matrix.mod }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # теги прошлых релизов — по ним галерея понимает, менялись ли скриншоты
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: release-${{ matrix.mod }}-*
          path: jars
          merge-multiple: true

      # Новой версии — тег и релиз; порт той же версии — JAR дописываются в её релиз
      - name: Тег и GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          jars=(jars/*.jar)
          tag="$MOD/$VERSION"
          if [ ${#jars[@]} -eq 0 ]; then
            echo "Этим прогоном на Modrinth ничего не выложено — релиз $tag не трогаю"
            exit 0
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${jars[@]}" --clobber
            echo "В релиз $tag добавлено: ${jars[*]##*/}" >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/ci.mjs changelog "$MOD" "$VERSION" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" "${jars[@]}" --target "$GITHUB_SHA" --title "$MOD $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Релиз — https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Последним: GitHub Release важнее для истории и не должен ждать правки страницы проекта
      - name: Ссылки, описание, галерея и устаревшие сборки на Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: node scripts/modrinth.mjs sync "$MOD"
