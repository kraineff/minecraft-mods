name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - '26.1'
          - '26.2'
          - '26.3-snapshot-7'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Секция CHANGELOG.md для текущего mod_version — единственный
      # источник текста changelog для Modrinth (см. README → «Релиз»).
      - name: Extract changelog
        id: changelog
        run: |
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          ver_pattern=$(printf '%s' "$mod_version" | sed 's/[.[\*^$/]/\\&/g')
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="$ver_pattern" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.target }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        run: ./gradlew modrinth -PtargetMc=${{ matrix.target }} -Pchangelog="$CHANGELOG_BODY"

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync gallery to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: .github/scripts/sync-gallery.sh
